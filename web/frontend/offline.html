<body>
  <div class="wrap">
    <img src="/icons/icon-192.png" alt="SceneLink" class="logo">
    <h1>You're offline</h1>
    <p>Can't reach the SceneLink servers right now. Check your connection and try again — your plans and favorites will sync when you're back online.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
    <div class="indicator">
      <span class="dot" id="netDot"></span>
      <span id="netText">Offline</span>
    </div>
  </div>
  <script>
    function updateNet() {
      var online = navigator.onLine;
      document.getElementById('netDot').className = 'dot' + (online ? ' online' : '');
      document.getElementById('netText').textContent = online ? 'Back online — tap "Try again"' : 'Offline';
    }
    window.addEventListener('online', updateNet);
    window.addEventListener('offline', updateNet);
    updateNet();
    // Auto-reload on reconnect
    window.addEventListener('online', function(){ setTimeout(function(){ location.reload(); }, 800); });
  </script>
