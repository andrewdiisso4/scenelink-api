<!doctype html>
<html lang="en" data-sl-design="unified">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Reset your password — SceneLink</title>
  <!-- Scrub the token before loading any other resource. No analytics/app bundle. -->
  <script src="/js/sl-reset-password.js?v=connected-20261110-1"></script>
  <link rel="stylesheet" href="/css/sl-phase8-launch.css?v=connected-20261110-1">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#050506;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:32px 20px}main{max-width:460px;margin:8vh auto;background:#101012;border:1px solid #343027;border-radius:18px;padding:32px}.brand{color:#d4af37;font-size:24px;font-weight:750;text-decoration:none}h1{font-size:28px;margin:24px 0 12px}p{line-height:1.6;color:#c6c6ca}label{display:block;margin:20px 0 8px;font-weight:600}input{display:block;width:100%;background:#18181c;color:#fff;border:1px solid #62626a;border-radius:8px;padding:13px;font:inherit}input:focus,button:focus-visible,a:focus-visible{outline:3px solid #d4af37;outline-offset:3px}button{width:100%;margin-top:24px;border:0;border-radius:8px;padding:14px;background:#d4af37;color:#111;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}.back{color:#e4c76c}#resetStatus{min-height:3em}#resetStatus[data-kind="error"]{color:#ffb4b4}#resetStatus[data-kind="success"]{color:#aadfb7}[hidden]{display:none!important}@media(max-width:480px){main{padding:24px;margin:4vh auto}}
  </style>
  <link rel="stylesheet" href="/css/sl-design-system.css?v=connected-20261110-1">
</head>
<body>
  <main>
    <a class="brand" href="/">SceneLink</a>
    <h1>Choose a new password</h1>
    <p>Use at least 8 characters and no more than 72 UTF-8 bytes. This link can be used only once.</p>
    <form id="resetForm" novalidate>
      <label for="newPassword">New password</label>
      <input id="newPassword" name="new-password" type="password" autocomplete="new-password" minlength="8" required disabled>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required disabled>
      <button id="resetSubmit" type="submit" disabled>Reset password</button>
    </form>
    <p id="resetStatus" role="status" aria-live="polite" aria-atomic="true">Checking your reset link…</p>
    <p><a class="back" href="/">Return to SceneLink</a></p>
    <noscript><p>JavaScript is required to reset your password. No password has been submitted.</p></noscript>
  </main>
</body>
</html>
