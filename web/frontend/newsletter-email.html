<!doctype html>
<html lang="en" data-sl-design="unified">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>SceneLink newsletter</title>
  <script src="/js/sl-newsletter-email.js?v=connected-20261128-december-audit"></script>
  <link rel="stylesheet" href="/css/sl-account-entry.css?v=connected-20261128-december-audit">
  <link rel="stylesheet" href="/css/sl-design-system.css?v=connected-20261128-december-audit">
</head>
<body class="sl-account-entry">
  <main class="sl-account-card" aria-labelledby="newsletterTitle">
    <a class="sl-account-brand" href="/" aria-label="SceneLink home"><img src="/images/brand/scenelink-full.png" width="88" height="88" alt="SceneLink"></a>
    <p class="sl-account-kicker">SceneLink newsletter</p>
    <h1 id="newsletterTitle">Manage your email subscription</h1>
    <button id="newsletterAction" class="sl-account-submit sl-primary" type="button" disabled>Continue</button>
    <p id="newsletterStatus" role="status" aria-live="polite">Checking your link…</p>
    <p><a class="sl-account-back" href="/">Return to SceneLink</a></p>
    <noscript><p>JavaScript is required. No subscription change has been submitted.</p></noscript>
  </main>
</body>
</html>
