<!doctype html>
<html lang="en" data-sl-design="unified">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Business password reset — SceneLink</title>
  <!-- Scrub the token before loading any other resource. No analytics/app bundle. -->
  <script src="/js/sl-reset-password.js?v=connected-20261128-owner-integrity"></script>
  <link rel="stylesheet" href="/css/sl-account-entry.css?v=connected-20261128-owner-integrity">
  <link rel="stylesheet" href="/css/sl-design-system.css?v=connected-20261128-owner-integrity">
</head>
<body class="sl-account-entry">
  <main class="sl-account-card" aria-labelledby="accountTitle">
    <a class="sl-account-brand" href="/" aria-label="SceneLink home"><img src="/images/brand/scenelink-full.png" width="88" height="88" alt="SceneLink"></a>
    <p class="sl-account-kicker">Account recovery</p>
    <h1 id="accountTitle">Reset your business password</h1>
    <p>Choose a unique password with at least 8 characters. This link can be used only once.</p>
    <form id="resetForm" novalidate>
      <label for="newPassword">New password</label>
      <div class="sl-account-password">
        <input id="newPassword" name="new-password" type="password" autocomplete="new-password" minlength="8" required disabled>
        <button type="button" data-password-toggle="newPassword" aria-controls="newPassword" aria-label="Show password" aria-pressed="false" disabled>Show</button>
      </div>
      <label for="confirmPassword">Confirm new password</label>
      <div class="sl-account-password">
        <input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required disabled>
        <button type="button" data-password-toggle="confirmPassword" aria-controls="confirmPassword" aria-label="Show password" aria-pressed="false" disabled>Show</button>
      </div>
      <button id="resetSubmit" class="sl-account-submit" type="submit" disabled>Reset password</button>
    </form>
    <p id="resetStatus" role="status" aria-live="polite" aria-atomic="true">Checking your reset link…</p>
    <p><a class="sl-account-back" href="/business?login=1">Return to business sign-in</a></p>
    <noscript><p>JavaScript is required to reset your password. No password has been submitted.</p></noscript>
  </main>
</body>
</html>
