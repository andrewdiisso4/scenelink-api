<!doctype html>
<html lang="en" data-sl-design="unified">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Verify your email — SceneLink</title>
  <!-- Scrub the token before loading any other resource. No analytics/app bundle. -->
  <script src="/js/sl-email-verification.js?v=connected-20261124-account-social"></script>
  <link rel="stylesheet" href="/css/sl-account-entry.css?v=connected-20261124-account-social">
  <link rel="stylesheet" href="/css/sl-design-system.css?v=connected-20261124-account-social">
</head>
<body class="sl-account-entry">
  <main class="sl-account-card" aria-labelledby="accountTitle">
    <a class="sl-account-brand" href="/" aria-label="SceneLink home"><img src="/images/brand/scenelink-full.png" width="88" height="88" alt="SceneLink"></a>
    <p class="sl-account-kicker">Email verification</p>
    <h1 id="accountTitle">Confirm your email address</h1>
    <p>Confirm that you own the email address associated with your SceneLink account. This link can be used only once.</p>
    <button id="verifySubmit" class="sl-account-submit sl-primary" type="button" disabled>Confirm email</button>
    <p id="verifyStatus" role="status" aria-live="polite" aria-atomic="true">Checking your verification link…</p>
    <p><a class="sl-account-back" href="/">Return to SceneLink</a></p>
    <noscript><p>JavaScript is required to confirm your email. No verification request has been submitted.</p></noscript>
  </main>
</body>
</html>
