  <style>
    :root {
      --bg: #0a0a0a;
      --card: #121212;
      --text: #eaeaea;
      --muted: #8a8a8a;
      --gold: #D4AF37;
      --gold-bright: #F5D97A;
      --gold-dark: #B8941F;
      --border: rgba(212,175,55,0.18);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--gold-dark));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
      margin-bottom: 48px;
    }
    h1 {
      font-size: 84px;
      line-height: 1;
      margin: 0 0 16px;
      background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--gold-dark));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      font-size: 24px;
      margin: 0 0 12px;
      color: var(--text);
      font-weight: 600;
    }
    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 32px;
      max-width: 480px;
    }
    .cta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: #0a0a0a;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary {
      background: transparent;
      color: var(--gold);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: rgba(212,175,55,0.08); border-color: var(--gold); }
    .suggestions {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 480px;
    }
    .suggestions h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin: 0 0 16px;
      font-weight: 600;
    }
    .links {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      color: var(--gold);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 0;
    }
    .links a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      .wrap { padding: 40px 20px; }
      h1 { font-size: 64px; }
      h2 { font-size: 20px; }
    }
  </style>
