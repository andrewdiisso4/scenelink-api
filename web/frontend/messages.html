    <style>
      .msg-page {
        max-width: 1100px;
        margin: 100px auto 60px;
        padding: 0 20px;
      }
      .msg-shell {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 0;
        background: #0e0e0e;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        overflow: hidden;
        height: calc(100vh - 240px);
        min-height: 520px;
      }
      @media (max-width: 768px) {
        .msg-shell { grid-template-columns: 1fr; height: calc(100vh - 160px); }
        .msg-shell.has-thread .msg-list-col { display: none; }
        .msg-shell:not(.has-thread) .msg-thread-col { display: none; }
      }

      .msg-list-col {
        border-right: 1px solid rgba(255,255,255,0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .msg-list-head {
        padding: 16px 18px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .msg-list-head h2 {
        margin: 0; font-size: 18px; color: #fff; font-weight: 700;
      }
      .msg-list-head button {
        background: transparent; border: 1px solid rgba(212,175,55,0.5);
        color: #D4AF37; padding: 6px 10px; border-radius: 8px;
        font-size: 12px; cursor: pointer;
      }
      .msg-list-scroll {
        flex: 1;
        overflow-y: auto;
      }
      .msg-item {
        display: flex;
        gap: 12px;
        padding: 14px 18px;
        cursor: pointer;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        transition: background 0.15s;
      }
      .msg-item:hover { background: rgba(255,255,255,0.03); }
      .msg-item.active { background: rgba(212,175,55,0.08); border-left: 3px solid #D4AF37; padding-left: 15px; }
      .msg-item img { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
      .msg-item .msg-meta { flex: 1; min-width: 0; }
      .msg-item .msg-meta strong { display: block; color: #fff; font-size: 14px; }
      .msg-item .msg-meta small {
        display: block; color: rgba(255,255,255,0.5); font-size: 12px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
      }
      .msg-item .msg-unread-dot {
        width: 10px; height: 10px; border-radius: 50%; background: #D4AF37;
        align-self: center; flex-shrink: 0;
      }

      .msg-thread-col { display: flex; flex-direction: column; min-width: 0; }
      .msg-thread-head {
        padding: 14px 18px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        display: flex; align-items: center; gap: 12px;
      }
      .msg-thread-head .msg-back {
        display: none;
        background: transparent; border: 0; color: #D4AF37;
        font-size: 18px; cursor: pointer; padding: 0;
      }
      @media (max-width: 768px) { .msg-thread-head .msg-back { display: inline-block; } }
      .msg-thread-head img { width: 40px; height: 40px; border-radius: 50%; }
      .msg-thread-head strong { color: #fff; font-size: 15px; }
      .msg-thread-head small { color: rgba(255,255,255,0.5); font-size: 12px; display: block; }

      .msg-thread-body {
        flex: 1; overflow-y: auto;
        padding: 18px; display: flex; flex-direction: column; gap: 8px;
      }
      .msg-bubble {
        max-width: 70%; padding: 9px 14px; border-radius: 16px;
        font-size: 14px; line-height: 1.45; word-break: break-word;
      }
      .msg-bubble.me {
        align-self: flex-end;
        background: linear-gradient(135deg,#D4AF37,#b8860b); color:#000;
      }
      .msg-bubble.them { align-self: flex-start; background: rgba(255,255,255,0.08); color:#fff; }
      .msg-bubble small { display: block; font-size: 10px; opacity: 0.6; margin-top: 3px; }

      .msg-composer {
        display: flex; gap: 8px; padding: 12px 16px;
        border-top: 1px solid rgba(255,255,255,0.06);
      }
      .msg-composer input {
        flex: 1;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        color: #fff; padding: 10px 14px; border-radius: 20px; font-size: 14px;
      }
      .msg-composer input:focus { outline: none; border-color: #D4AF37; }
      .msg-composer button {
        background: linear-gradient(135deg,#D4AF37,#b8860b);
        color: #000; border: 0; width: 40px; height: 40px; border-radius: 50%;
        cursor: pointer; font-size: 16px;
      }

      .msg-empty {
        flex: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: rgba(255,255,255,0.4); text-align: center; padding: 40px;
      }
      .msg-empty i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
      .msg-empty h3 { color: #fff; margin: 0 0 8px; }
      .msg-empty p { margin: 0; font-size: 14px; }

      .msg-find-wrap {
        padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .msg-find-wrap input {
        width: 100%; background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1); color: #fff;
        padding: 8px 12px; border-radius: 8px; font-size: 13px;
      }
      .msg-find-results {
        max-height: 200px; overflow-y: auto;
        background: #161616; border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px; margin-top: 8px; display: none;
      }
      .msg-find-results.open { display: block; }
      .msg-find-row {
        padding: 8px 10px; display: flex; gap: 10px; align-items: center;
        cursor: pointer; font-size: 13px;
      }
      .msg-find-row:hover { background: rgba(255,255,255,0.04); }
      .msg-find-row img { width: 28px; height: 28px; border-radius: 50%; }
      .msg-find-row strong { color: #fff; display: block; }
      .msg-find-row small { color: #888; }
    </style>
