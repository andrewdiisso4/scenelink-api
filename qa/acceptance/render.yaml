# Isolated synthetic acceptance only. This is NOT the production render.yaml.
# Read DEPLOYMENT_PROPOSAL.md before creating or applying a Blueprint.
# Create with existingResources=create_new and autoSync=false.
previews:
  generation: 'off'

projects:
  - name: scenelink-release-qa-20261123
    environments:
      - name: acceptance
        services:
          - type: web
            name: scenelink-release-qa-20261123
            runtime: node
            repo: https://github.com/andrewdiisso4/scenelink-api
            branch: release/acceptance-candidate-20261123
            region: virginia
            plan: free
            autoDeployTrigger: 'off'
            buildCommand: npm ci --omit=dev --ignore-scripts
            startCommand: node qa/acceptance/start.cjs
            healthCheckPath: /__acceptance/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: NODE_VERSION
                value: '24.22.1'
              - key: ACCEPTANCE_MODE
                value: isolated-synthetic
              - key: ACCEPTANCE_ENVIRONMENT_ID
                value: scenelink-release-qa-20261123
              - key: DATABASE_URL
                fromDatabase:
                  name: scenelink-release-qa-db-20261123
                  property: connectionString
              - key: ACCEPTANCE_DB_HOST
                fromDatabase:
                  name: scenelink-release-qa-db-20261123
                  property: host
              - key: ACCEPTANCE_DB_NAME
                fromDatabase:
                  name: scenelink-release-qa-db-20261123
                  property: database
              - key: JWT_SECRET
                generateValue: true
              - key: ACCEPTANCE_ACCESS_SECRET
                generateValue: true
              - key: ACCEPTANCE_FIXTURE_PASSWORD
                generateValue: true
              - key: ALLOW_DEMO_SEED
                value: 'false'
              - key: FORCE_RESEED
                value: 'false'
              - key: EMAIL_PROVIDER
                value: disabled
        databases:
          - name: scenelink-release-qa-db-20261123
            databaseName: scenelink_release_qa_20261123
            user: scenelink_release_qa
            postgresMajorVersion: '18'
            region: virginia
            plan: free
            ipAllowList: []
